name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml

      - run: bash scripts/smoke.sh

      - run: python3 scripts/test_usage_tracker.py

      - run: python3 scripts/test_model_router.py

  workerpool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - run: go build ./...
        working-directory: workerpool

      - run: go vet ./...
        working-directory: workerpool

      - run: go test ./... -race
        working-directory: workerpool
